# Codex 팀 공통 설정: 비밀값 파일 읽기 금지 (계획서 20.2)
# Claude Code의 .claude/settings.json 과 같은 목적이다.
# 프로젝트 설정은 Codex에서 이 폴더를 "신뢰(trust)"해야 적용된다.

default_permissions = "edu-web-pacs"

[permissions.edu-web-pacs]
description = "edu-web-pacs: 작업 폴더 편집 허용, 비밀값 파일 읽기 금지"
extends = ":workspace"

[permissions.edu-web-pacs.filesystem.":workspace_roots"]
".env" = "deny"
"secrets" = "deny"
"**/sa-*.json" = "deny"
"**/serviceAccount*.json" = "deny"
